{% extends "base.html" %}
{% block title %}Account - Student Management{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header bg-white"><h4 class="mb-0"><i class="bi bi-shield-lock"></i> Change password</h4></div>
      <div class="card-body">
        <p class="text-muted">Logged in as <strong>{{ session.get('username') }}</strong></p>
        <form method="post" autocomplete="off">
          <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Current password</label>
            <input type="password" name="current_password" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">New password (min 6 characters)</label>
            <input type="password" name="new_password" class="form-control" minlength="6" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm new password</label>
            <input type="password" name="confirm_password" class="form-control" minlength="6" required>
          </div>
          <button class="btn btn-primary" type="submit"><i class="bi bi-check-circle"></i> Update password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
