{% extends "base.html" %}
{% block title %}Subjects - Student Management{% endblock %}
{% block content %}
<h3 class="mb-3"><i class="bi bi-journal-bookmark-fill"></i> Subjects</h3>

<div class="row g-4">
  <div class="col-lg-4">
    <div class="card shadow-sm">
      <div class="card-header bg-white fw-semibold">Add subject</div>
      <div class="card-body">
        <form method="post">
          <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Subject code *</label>
            <input type="text" name="code" class="form-control" placeholder="e.g. PY101" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Subject name *</label>
            <input type="text" name="name" class="form-control" placeholder="e.g. Python Programming" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Maximum marks</label>
            <input type="number" name="max_marks" class="form-control" value="100" min="1" max="1000">
          </div>
          <button class="btn btn-primary w-100" type="submit"><i class="bi bi-plus-circle"></i> Add subject</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light"><tr><th>Code</th><th>Name</th><th>Max marks</th><th class="text-end">Action</th></tr></thead>
          <tbody>
          {% for s in subjects %}
            <tr>
              <td class="fw-semibold">{{ s.code }}</td>
              <td>{{ s.name }}</td>
              <td>{{ s.max_marks }}</td>
              <td class="text-end">
                <form method="post" action="{{ url_for('delete_subject', subject_id=s.id) }}" class="d-inline"
                      onsubmit="return confirm('Delete this subject? All marks for it will also be deleted.');">
                  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                  <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button>
                </form>
              </td>
            </tr>
          {% else %}
            <tr><td colspan="4" class="text-center text-muted py-5">No subjects yet. Add your first one.</td></tr>
          {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
